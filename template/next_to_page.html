  <a href="http://127.0.0.1:8000/">

<section class="cards-wrapper">

  {% for product in products %}
  <div class="card-grid-space">

    <div class="num">{{ product.id }}</div>

    <!-- Make the card clickable: go to detail page -->
    <a class="card"
       href="{% url 'Detail' product.id %}"
       style="--bg-img: url('{% if product.image %}{{ product.image.url }}{% endif %}')">
      <div>
        <h1>{{ product.name_product }}</h1>
        <div class="date">{{ product.created_at }}</div>
        <div class="tags">
          <!-- Optional tags -->
        </div>
      </div>
    </a>
  </div>
  {% endfor %}

</section>
